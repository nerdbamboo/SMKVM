[workspace]
resolver = "2"
members = [
    "crates/smkvm-layout",
    "crates/smkvm-proto",
    "crates/smkvm-config",
    "crates/smkvm-input",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-2.0-or-later"
repository = "https://github.com/nerdbamboo/SMKVM"
authors = ["SMKVM contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
postcard = { version = "1", features = ["use-std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
