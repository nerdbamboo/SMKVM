# A server-side text config of the kind a multi-monitor user ends up
# hand-writing, because the GUI cannot express partial edges.
section: screens
	ubuntu-box:
	WIN-STUDY:
	WIN-LAPTOP:
end

section: links
	ubuntu-box:
		up(0,50)   = WIN-STUDY
		up(50,100) = WIN-LAPTOP
	WIN-STUDY:
		down  = ubuntu-box(0,50)
		right = WIN-LAPTOP
	WIN-LAPTOP:
		down = ubuntu-box(50,100)
		left = WIN-STUDY
end

section: aliases
	ubuntu-box:
		linux-desk
end

section: options
	switchDelay = 250
	clipboardSharing = true
	screenSaverSync = true
	relativeMouseMoves = false
end
