[package]
name = "smkvm-input"
description = "Keyboard and pointer capture and injection, per platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
smkvm-layout = { path = "../smkvm-layout" }
smkvm-proto = { path = "../smkvm-proto" }
thiserror = { workspace = true }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", features = ["randr", "xfixes", "xtest"] }

[dev-dependencies]
proptest = "1"

# Tests that ask what the capture hook sees need a way to produce input the
# hook will report, which means injecting without this crate's marker on it.
# Nothing in the public API can do that, and nothing should.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
] }
