[package]
name = "smkvm-gui"
description = "The window for arranging machines, pairing them, and changing how switching behaves"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
smkvm-config = { path = "../smkvm-config" }
smkvm-input = { path = "../smkvm-input" }
smkvm-layout = { path = "../smkvm-layout" }
smkvm-net = { path = "../smkvm-net" }
smkvm-proto = { path = "../smkvm-proto" }
# Drawn through OpenGL rather than eframe's default. The default renderer
# brings in wgpu, whose Direct3D backend does not compile for Windows from
# here, and these binaries are cross-compiled from Linux.
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.36"
toml_edit = "0.22"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time"] }
thiserror = { workspace = true }
tracing = "0.1"

[dev-dependencies]
proptest = "1"
