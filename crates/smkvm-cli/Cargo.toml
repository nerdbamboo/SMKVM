[package]
name = "smkvm-cli"
description = "The smkvm command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "smkvm"
path = "src/main.rs"

[dependencies]
smkvm-layout = { path = "../smkvm-layout" }
smkvm-proto = { path = "../smkvm-proto" }
smkvm-config = { path = "../smkvm-config" }
smkvm-input = { path = "../smkvm-input" }
smkvm-core = { path = "../smkvm-core" }
smkvm-net = { path = "../smkvm-net" }
smkvm-clipboard = { path = "../smkvm-clipboard" }
anyhow = "1"
serde = { workspace = true }
postcard = { workspace = true }
thiserror = { workspace = true }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Asking whether the process named in a stale status report still exists, and
# -- for `--system` -- being a service: the service control manager, the
# interactive session's token, a process started on a named desktop, and the
# pipe that is the only way into that process.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
] }
