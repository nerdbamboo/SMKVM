name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The X11 injection tests run against a private virtual server rather
      # than any real session. Without it they skip, which would quietly stop
      # covering the backend.
      - name: install a virtual X server
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  cross:
    name: compiles for windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Catches Windows-only breakage without needing a Windows runner or a
      # linker, since neither `check` nor `clippy` links. Linting for the
      # target as well as checking it matters because most of the
      # platform-specific code only exists there.
      - run: cargo check --workspace --all-targets --target x86_64-pc-windows-msvc
      - run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: Swatinem/rust-cache@v2
      # Pure crates only: the platform crates pull in newer toolchain needs.
      - run: cargo check -p smkvm-layout -p smkvm-proto
